apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 922805825674.dkr.ecr.us-west-2.amazonaws.com/auth_service:latest
          ports:
            - containerPort: 8000
          command: ["uvicorn"]
          args:
            - "main:app"
            - "--host"
            - "0.0.0.0"
            - "--port=8000"

          env:
            - name: COGNITO_CLIENT_ID
              value: "6rqobnfsf0lnfen24me10j7d2v"
            - name: COGNITO_CLIENT_SECRET
              value: "1gjtqd8hu2kibsg4pu47gvu7qpatjacaer3ajp5lm0pj5e30o89q"
            - name: AWS_REGION
              value: "us-west-2"
